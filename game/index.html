<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Vault — a heist game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0d16;
    color: #e8e4d8;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 4px;
    color: #e8b64c;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0;
    font-size: 14px;
    color: #b9c0d4;
    font-style: italic;
  }
  canvas {
    display: block;
    max-width: min(1280px, 96vw);
    max-height: calc(96vh - 110px);
    width: auto;
    height: auto;
    border: 2px solid #8a6d2f;
    box-shadow: 0 0 42px rgba(232, 182, 76, 0.18);
    background: #1a2033;
  }
  p.help {
    margin: 0;
    font-size: 13px;
    color: #8a90a5;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>The Velvet Vault</h1>
  <p class="sub">Three rooms. Three prizes. Nobody saw a thing.</p>
  <canvas id="game" width="1280" height="800"></canvas>
  <p class="help">WASD / arrows move &middot; Shift sneak &middot; Click throws a coin &middot; Space smoke bomb &middot; P pause &middot; M mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
